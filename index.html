<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c3cee" id="meta-theme-color" />
    
    <title>In Task — Foco Diário, Projetos, Equipe e Metas</title>

    <meta property="og:title" content="In Task — Foco Diário, Projetos, Equipe e Metas" />
    <meta property="og:description" content="Aplicativo de tarefas e produtividade com foco do dia, captura rápida, planejador semanal, Kanban, organizações com aprovação e metas de longo prazo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Ícone SVG direto embutido em base64/URI (elimina erro de cache e exibe imediatamente) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='48' fill='%231c3cee'/%3E%3Cpath d='M60 98L84 122L134 72' stroke='white' stroke-width='18' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='48' fill='%231c3cee'/%3E%3Cpath d='M60 98L84 122L134 72' stroke='white' stroke-width='18' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('intask_theme_snapshot');
          var snap = raw ? JSON.parse(raw) : null;
          var mode = snap && (snap.themeMode === 'dark' || snap.themeMode === 'light')
            ? snap.themeMode
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          if (mode === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          if (snap && snap.vars) {
            for (var k in snap.vars) {
              root.style.setProperty(k, snap.vars[k]);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased selection:bg-[var(--accent-soft)] selection:text-[var(--accent-text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
